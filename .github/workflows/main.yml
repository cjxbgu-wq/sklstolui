name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Check syntax
      run: |
        python -m py_compile *.py

    - name: Package source snapshot
      run: |
        mkdir -p dist
        zip -r dist/vacm-decompiled-source.zip \
            *.py requirements.txt README.md scripts/ \
            -x "*.pyc" -x "__pycache__/*"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: vacm-decompiled-source
        path: dist/vacm-decompiled-source.zip
